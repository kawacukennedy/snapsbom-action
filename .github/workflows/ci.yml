name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    name: self-test / ${{ matrix.os }} / ${{ matrix.format }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        format: [spdx, cyclonedx]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SBOM (first run)
        id: first
        uses: ./
        with:
          path: test
          format: ${{ matrix.format }}
          output: run1.json

      - name: Generate SBOM (second run)
        id: second
        uses: ./
        with:
          path: test
          format: ${{ matrix.format }}
          output: run2.json

      - name: Assert the two runs are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const a = fs.readFileSync("run1.json");
            const b = fs.readFileSync("run2.json");
            if (a.length !== b.length || !a.equals(b)) {
              console.error("::error::Output is not reproducible: run1.json and run2.json differ.");
              process.exit(1);
            }
            console.log(`Reproducible: ${a.length} bytes, identical across runs.`);
          '

      - name: Assert the two runs report the same digest
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.first.outputs.sha256 }}" != "${{ steps.second.outputs.sha256 }}" ]; then
            echo "::error::Digest mismatch between runs."
            exit 1
          fi
          if [ "${{ steps.first.outputs.components }}" = "0" ]; then
            echo "::error::SBOM contains zero components — the fixture was not parsed."
            exit 1
          fi

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.os }}-${{ matrix.format }}
          path: run1.json
          if-no-files-found: error

  cross-os:
    name: cross-OS byte equality
    needs: self-test
    runs-on: ubuntu-latest
    steps:
      - name: Download all SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Compare digests across operating systems
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");

            const root = "artifacts";
            const groups = {};
            for (const dir of fs.readdirSync(root)) {
              const match = dir.match(/^sbom-(.+)-(spdx|cyclonedx)$/);
              if (!match) continue;
              const file = path.join(root, dir, "run1.json");
              if (!fs.existsSync(file)) continue;
              const digest = crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
              (groups[match[2]] ||= []).push({ os: match[1], digest });
            }

            let failed = false;
            for (const [format, entries] of Object.entries(groups)) {
              console.log(`\n${format}`);
              for (const { os, digest } of entries.sort((a, b) => a.os.localeCompare(b.os))) {
                console.log(`  ${digest}  ${os}`);
              }
              const unique = new Set(entries.map((e) => e.digest));
              if (entries.length < 3) {
                console.error(`::error::Expected 3 operating systems for ${format}, found ${entries.length}.`);
                failed = true;
              } else if (unique.size !== 1) {
                console.error(`::error::${format} output differs across operating systems.`);
                failed = true;
              } else {
                console.log(`  ✓ byte-identical on Linux, macOS and Windows`);
              }
            }
            process.exit(failed ? 1 : 0);
          JS

  rejected-inputs:
    name: rejected inputs fail the build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: A directory with no lockfile is rejected
        id: no_lockfile
        continue-on-error: true
        uses: ./
        with:
          path: .github
          format: spdx

      - name: An invalid format is rejected
        id: bad_format
        continue-on-error: true
        uses: ./
        with:
          path: test
          format: swdx

      - name: Assert both attempts failed
        shell: bash
        env:
          OUTCOME_LOCKFILE: ${{ steps.no_lockfile.outcome }}
          OUTCOME_FORMAT: ${{ steps.bad_format.outcome }}
        run: |
          set -euo pipefail
          ok=1
          if [ "${OUTCOME_LOCKFILE}" != "failure" ]; then
            echo "::error::Expected a directory without a lockfile to fail, got '${OUTCOME_LOCKFILE}'."
            ok=0
          fi
          if [ "${OUTCOME_FORMAT}" != "failure" ]; then
            echo "::error::Expected an invalid format to fail, got '${OUTCOME_FORMAT}'."
            ok=0
          fi
          if [ "${ok}" = "1" ]; then
            echo "Both invalid inputs were rejected."
          fi
          exit $((1 - ok))
